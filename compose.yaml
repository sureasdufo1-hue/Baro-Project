services:
  policy-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dbins_policy
      POSTGRES_USER: dbins_policy
      POSTGRES_PASSWORD: dbins_policy_dev
    ports:
      - "5433:5432"
    volumes:
      - policy_postgres_data:/var/lib/postgresql/data
      - ./dbins_poc/bootstrap_postgresql.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
      - ./dbins_poc/migrations/003_policy_verification_reviews.sql:/docker-entrypoint-initdb.d/003-policy-verification-reviews.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbins_policy -d dbins_policy"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claimlens
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-claimlens_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-claimlens-local-secret-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-claimlens_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-claimlens-local-secret-change-me}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/claimlens-private &&
      mc anonymous set none local/claimlens-private"

  clamav:
    image: clamav/clamav:latest
    environment:
      CLAMAV_NO_FRESHCLAM: "false"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b-instruct"]
    depends_on:
      ollama:
        condition: service_started

  ocr:
    build:
      context: ./local-services/ocr
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  extraction:
    build:
      context: ./local-services/extraction
    ports:
      - "8101:8101"
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://claimlens:claimlens_dev@postgres:5432/claimlens}
      POLICY_DATABASE_URL: ${POLICY_DATABASE_URL:-postgresql+psycopg://dbins_policy:dbins_policy_dev@policy-postgres:5432/dbins_policy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_SECRET: ${SESSION_SECRET:-compose-development-secret-change-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-LOCAL_PRIVATE}
      LOCAL_OBJECT_STORAGE_ROOT: /app/.storage/private
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MALWARE_SCANNER_PROVIDER: ${MALWARE_SCANNER_PROVIDER:-DEVELOPMENT}
      CLAMAV_HOST: ${CLAMAV_HOST:-localhost}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
      OCR_PROVIDER: ${OCR_PROVIDER:-DEVELOPMENT}
      OCR_API_ENDPOINT: ${OCR_API_ENDPOINT:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-DEVELOPMENT}
      AI_API_ENDPOINT: ${AI_API_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      policy-postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *backend_environment
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/.storage/private
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NODE_ENV: production
    ports:
      - "3004:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WEB_URL: http://localhost:3004
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/policy-verification"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *backend_environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

volumes:
  postgres_data:
  policy_postgres_data:
  document_storage:
  minio_data:
  ollama_data:
