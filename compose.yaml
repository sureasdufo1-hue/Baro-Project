services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claimlens
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://claimlens:claimlens_dev@postgres:5432/claimlens
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: compose-development-secret-change-before-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      OBJECT_STORAGE_PROVIDER: LOCAL_PRIVATE
      LOCAL_OBJECT_STORAGE_ROOT: /app/.storage/private
      MALWARE_SCANNER_PROVIDER: DEVELOPMENT
      OCR_PROVIDER: DEVELOPMENT
      AI_PROVIDER: DEVELOPMENT
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *backend_environment
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/.storage/private
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *backend_environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  document_storage:
